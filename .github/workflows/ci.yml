name: ci

# Same rule as the engine's ci.yml: a pull request finds out in under three
# minutes. A check slower than a context switch is a check people learn to
# ignore, and that failure shows up as branches merged without waiting rather
# than as red builds.
#
# Linux runs in the official Swift images rather than through a setup action.
# The first version of this file used swift-actions/setup-swift and it failed on
# the first push, because the action carries its own list of available versions
# and that list did not have 6.3 in it yet. A toolchain the vendor publishes as
# a container is a toolchain that is correct on the day it ships, with nothing
# in between to go stale.
#
# macOS cannot work that way, so it selects an Xcode instead. That is where the
# other first-push failure came from: the runner's default Xcode was too old to
# parse a swift-tools-version 6.2 manifest, and xcodebuild reported it as a
# dependency resolution failure on a package that has no dependencies.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Style first, so a run that is going to fail on formatting fails in forty
  # seconds instead of after the whole matrix.
  style:
    runs-on: ubuntu-latest
    container: swift:6.3
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: format
        run: swift format lint --strict --recursive Sources Tests Package.swift

  linux:
    name: linux (swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 6.2 is the floor declared in Package.swift. If this job breaks then
        # the floor moved and the manifest is lying about it.
        # 6.3 is current, and it is where a new deprecation warning lands first.
        swift: ["6.2", "6.3"]
    steps:
      - uses: actions/checkout@v7.0.1
      - run: swift --version
      - name: build
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: test
        run: swift test --skip-build

  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable
      # Printed before anything is built, because both of the first-push
      # failures in this file were toolchain version problems reported as
      # something else entirely.
      - name: toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: build
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: test
        run: swift test --skip-build

  # A package that resolves for us and not for a consumer is the failure this
  # job exists to catch. It builds from a clean clone with no cache and no
  # Package.resolved, which is what a user who types `swift package add` gets.
  consume:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable
      - name: resolve from scratch
        run: |
          rm -f Package.resolved
          swift package resolve
          swift build -c release

  # The platform slices that only differ at link time. Cheap, and it catches an
  # availability annotation that is wrong for watchOS before a user does.
  platforms:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        destination:
          - "generic/platform=iOS"
          - "generic/platform=tvOS"
          - "generic/platform=watchOS"
          - "generic/platform=visionOS"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable
      # The scheme is the package name from Package.swift, not the product name.
      # SwiftPM generates one implicit scheme per package and calls it after the
      # package, so `-scheme Yodb` fails with a message about a workspace, which
      # is a confusing way to be told you used the wrong one of two names that
      # differ only in case. Printed here so the next person does not have to
      # find that out from a red build.
      - name: toolchain and schemes
        run: |
          xcodebuild -version
          xcodebuild -list
      # No pipe into a log prettifier here. A pipe hands back the exit code of
      # the last command in it, so a prettifier that succeeds turns a failed
      # build green unless pipefail is set, and that is a bug worth not having
      # at all rather than worth remembering to guard.
      - name: build for ${{ matrix.destination }}
        run: |
          xcodebuild build \
            -scheme yodb \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            -quiet
